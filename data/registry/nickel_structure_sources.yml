admission_policy:
  required_fields:
  - source_id
  - source_type
  - source_url
  - citation
  - structure_identity
  - benchmark_role
  - redistribution_policy
  notes:
  - A prototype or relaxed structure is not an experimental site-occupancy label.
  - Partial occupancies are admitted as measured truth only when the source reports a refinement method and uncertainty.
  - Source structures and benchmark-generated occupancy variants must have separate identifiers and provenance edges.

