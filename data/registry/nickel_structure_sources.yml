local_generated_seed_set:
  provenance_class: benchmark_generated
  external_structure_file_source: none
  generator_implementation: alloy_xrd_bench/structures.py
  recipe_source: configs/alloy_recipes_v0_1.yml
  source_directory: data/shared/structures_initial
  pair_manifest: data/shared/manifests/gamma_prime_pairs.parquet
  pair_count: 8
  structure_count: 16
  alloy_systems:
    Ni-Al: 2
    Ni-Al-Ti: 2
    Ni-Al-Ta: 2
    Ni-Al-Ti-Ta: 2
  generation_methods:
    gamma: fcc_pair_balance_occupancy
    gamma_prime: l12_sublattice_occupancy
  crystallographic_basis:
    implementation: hard_coded_canonical_fractional_coordinates
    gamma_fcc:
      conventional_sites:
      - [0.0, 0.0, 0.0]
      - [0.0, 0.5, 0.5]
      - [0.5, 0.0, 0.5]
      - [0.5, 0.5, 0.0]
    gamma_prime_l12:
      minority_corner_site: [0.0, 0.0, 0.0]
      majority_face_sites:
      - [0.0, 0.5, 0.5]
      - [0.5, 0.0, 0.5]
      - [0.5, 0.5, 0.0]
    cross_checked_reference_ids:
    - aflow_l12_ab3_cp4_221_a_c_001
    - oqmd_alni3_entry_17890
    derivation_note: The local files were not downloaded or converted from these references; the references independently confirm the canonical L12 topology.
  parameter_provenance:
    lattice_parameters_angstrom:
      Ni-Al: 3.57
      Ni-Al-Ti: 3.58
      Ni-Al-Ta: 3.59
      Ni-Al-Ti-Ta: 3.59
    lattice_parameter_status: benchmark_configuration_not_yet_bound_to_a_specific_experimental_record
    compositions_status: benchmark_design_heuristics_not_measured_phase_compositions
    partitioning_rule_status: benchmark_design_assumption_not_experimental_partitioning_truth
    seeds_status: deterministic_generator_seeds
  relaxed_derivatives:
  - potential_id: pot_chgnet_0p3p0
    count: 16
    source_doi: 10.1038/s42256-023-00716-3
  - potential_id: pot_mace_mp_0b3_medium
    count: 16
    source_doi: 10.48550/arXiv.2401.00096
  - potential_id: pot_matgl_m3gnet_matpes_pbe_2025_2
    count: 16
    source_doi: 10.48550/arXiv.2212.07687
  - potential_id: pot_ni3al_mtp_darus_yield_anomaly_2024
    count: 2
    source_doi: 10.18419/DARUS-4480
  intended_use:
  - controlled_occupancy_variant_generation
  - gamma_gamma_prime_peak_overlap_pilot
  limitations:
  - The structures are generated seeds, not downloaded experimental structures.
  - The current seeds encode discrete occupations rather than refined partial occupancies.
  - Literature-backed occupancy ranges and uncertainty are not yet attached.

next_admission_targets:
- priority: 1
  target: experimental_Ni3Al_L12_CIF
  requirement: open CIF with lattice parameters, measurement metadata, and a citable source
- priority: 2
  target: refined_Ni3Al_antisite_or_order_parameter
  requirement: diffraction refinement with reported occupancy or long-range-order uncertainty
- priority: 3
  target: Ni3_Al_Ti_and_Ni3_Al_Ta_site_preference
  requirement: published sublattice preference or occupancy ranges with composition and temperature
- priority: 4
  target: gamma_gamma_prime_experimental_pair
  requirement: paired phase compositions, lattice parameters, phase fractions, and XRD measurement conditions
